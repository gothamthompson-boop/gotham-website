<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gotham Junior</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    header {
      padding: 50px 20px;
      background: linear-gradient(135deg, #111, #222);
    }

    h1 {
      font-size: 42px;
      letter-spacing: 3px;
    }

    header p {
      margin-top: 12px;
      color: #ccc;
    }

    section {
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: #151515;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255,255,255,0.08);
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>GOTHAM JUNIOR</h1>
    <p>Welcome to my official website</p>
  </header>

  <section>
    <div class="card">
      <h2>About Me</h2>
      <p style="margin-top:15px;">
        Welcome to my personal space.  
        Here you can connect with me and discover more about my world.
      </p>

      <a class="btn" href="https://wa.me/255723518756">
        Chat with me on WhatsApp
      </a>
    </div>
  </section>

  <footer>
    © 2026 Gotham Junior. All Rights Reserved.
  </footer>

</body>
</html>
